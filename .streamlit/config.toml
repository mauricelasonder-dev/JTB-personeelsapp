[theme]
primaryColor = "#004F9F"        # De Reflex Blue U kleur voor knoppen en actieve elementen
backgroundColor = "#FFFFFF"     # Achtergrondkleur van de pagina
secondaryBackgroundColor = "#F0F2F6" # Kleur van de zijbalk en tabellen
textColor = "#262730"           # Standaard tekstkleur (gebruikt de 100% / 60% zwarttinten voor contrast)
font = "sans serif"             # Strak zakelijk lettertype
